<svg xmlns="http://www.w3.org/2000/svg" class="f" viewBox="0 0 740 444" width="740" role="img" aria-label="Did the addressee vote against the speaker that day?"><style>.f{font-family:system-ui,-apple-system,Segoe UI,sans-serif;font-size:12px}.t{fill:#0b0b0b}.t2{fill:#52514e}.g{stroke:#e6e5e1}@media (prefers-color-scheme:dark){.t{fill:#fff}.t2{fill:#c3c2b7}.g{stroke:#34332f}}</style><rect width="740" height="444" fill="none"/><text class="t" x="16" y="24" style="font-size:15px;font-weight:600">Did the addressee vote against the speaker that day?</text><text class="t2" x="16" y="42">share of village addressees whose same-day vote targeted the speaker; 95% game bootstrap</text><text class="t" x="220" y="68" text-anchor="end">all utterances</text><line x1="330.3" x2="391.8" y1="64" y2="64" stroke="#2a78d6" stroke-width="2.5"/><circle cx="360.8" cy="64" r="5" fill="#2a78d6"/><text class="t2" x="602" y="68">0.18  (n=523)</text><text class="t" x="220" y="98" text-anchor="end">delivered bald</text><line x1="334.3" x2="399.5" y1="94" y2="94" stroke="#2a78d6" stroke-width="2.5"/><circle cx="365.3" cy="94" r="5" fill="#2a78d6"/><text class="t2" x="602" y="98">0.19  (n=399)</text><text class="t" x="220" y="128" text-anchor="end">delivered positive</text><line x1="288.5" x2="411.5" y1="124" y2="124" stroke="#2a78d6" stroke-width="2.5"/><circle cx="346.1" cy="124" r="5" fill="#2a78d6"/><text class="t2" x="602" y="128">0.16  (n=124)</text><text class="t" x="220" y="158" text-anchor="end">setting: all_bald</text><line x1="310.5" x2="407.6" y1="154" y2="154" stroke="#2a78d6" stroke-width="2.5"/><circle cx="358.6" cy="154" r="5" fill="#2a78d6"/><text class="t2" x="602" y="158">0.18  (n=168)</text><text class="t" x="220" y="188" text-anchor="end">setting: liking</text><line x1="313.6" x2="424.2" y1="184" y2="184" stroke="#2a78d6" stroke-width="2.5"/><circle cx="371.4" cy="184" r="5" fill="#2a78d6"/><text class="t2" x="602" y="188">0.20  (n=168)</text><text class="t" x="220" y="218" text-anchor="end">setting: flipped</text><line x1="306.6" x2="399.2" y1="214" y2="214" stroke="#2a78d6" stroke-width="2.5"/><circle cx="353.2" cy="214" r="5" fill="#2a78d6"/><text class="t2" x="602" y="218">0.17  (n=187)</text><text class="t" x="220" y="248" text-anchor="end">setting: all_positive</text><text class="t2" x="236" y="248">too few data</text><text class="t" x="220" y="278" text-anchor="end">trusted addressee</text><line x1="350.7" x2="433.8" y1="274" y2="274" stroke="#2a78d6" stroke-width="2.5"/><circle cx="391.1" cy="274" r="5" fill="#2a78d6"/><text class="t2" x="602" y="278">0.22  (n=304)</text><text class="t" x="220" y="308" text-anchor="end">distrusted addressee</text><line x1="251.8" x2="319.2" y1="304" y2="304" stroke="#2a78d6" stroke-width="2.5"/><circle cx="283.3" cy="304" r="5" fill="#2a78d6"/><text class="t2" x="602" y="308">0.07  (n=108)</text><text class="t2" x="230.0" y="340" text-anchor="middle">0.00</text><text class="t2" x="410.0" y="340" text-anchor="middle">0.25</text><text class="t2" x="590.0" y="340" text-anchor="middle">0.50</text><text class="t2" x="16" y="364" style=font-weight:600>Settings (how the speaker addresses each listener):</text><text class="t2" x="16" y="380">all_bald: bald on-record to everyone</text><text class="t2" x="16" y="396">liking: positive politeness to trusted listeners, bald to the rest</text><text class="t2" x="16" y="412">flipped: positive politeness to distrusted listeners, bald to the rest</text><text class="t2" x="16" y="428">Trusted / distrusted = top / bottom half of the speaker&#x27;s own reliability ratings.</text></svg>