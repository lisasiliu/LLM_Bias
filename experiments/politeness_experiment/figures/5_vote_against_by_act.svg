<svg xmlns="http://www.w3.org/2000/svg" class="f" viewBox="0 0 740 294" width="740" role="img" aria-label="Votes against the speaker, by speech act and strategy"><style>.f{font-family:system-ui,-apple-system,Segoe UI,sans-serif;font-size:12px}.t{fill:#0b0b0b}.t2{fill:#52514e}.g{stroke:#e6e5e1}@media (prefers-color-scheme:dark){.t{fill:#fff}.t2{fill:#c3c2b7}.g{stroke:#34332f}}</style><rect width="740" height="294" fill="none"/><text class="t" x="16" y="24" style="font-size:15px;font-weight:600">Votes against the speaker, by speech act and strategy</text><text class="t2" x="16" y="42">village-to-village utterances; 95% game bootstrap</text><text class="t" x="220" y="68" text-anchor="end">recommend_action / bald</text><line x1="325.4" x2="387.5" y1="64" y2="64" stroke="#2a78d6" stroke-width="2.5"/><circle cx="356.1" cy="64" r="5" fill="#2a78d6"/><text class="t2" x="602" y="68">0.21  (n=333)</text><text class="t" x="220" y="98" text-anchor="end">recommend_action / positive</text><line x1="285.1" x2="396.1" y1="94" y2="94" stroke="#2a78d6" stroke-width="2.5"/><circle cx="338.6" cy="94" r="5" fill="#2a78d6"/><text class="t2" x="602" y="98">0.18  (n=105)</text><text class="t" x="220" y="128" text-anchor="end">question / bald</text><line x1="238.6" x2="325.7" y1="124" y2="124" stroke="#2a78d6" stroke-width="2.5"/><circle cx="275.5" cy="124" r="5" fill="#2a78d6"/><text class="t2" x="602" y="128">0.08  (n=66)</text><text class="t" x="220" y="158" text-anchor="end">question / positive</text><line x1="230.0" x2="324.7" y1="154" y2="154" stroke="#2a78d6" stroke-width="2.5"/><circle cx="261.6" cy="154" r="5" fill="#2a78d6"/><text class="t2" x="602" y="158">0.05  (n=19)</text><text class="t2" x="230.0" y="190" text-anchor="middle">0.00</text><text class="t2" x="410.0" y="190" text-anchor="middle">0.30</text><text class="t2" x="590.0" y="190" text-anchor="middle">0.60</text><text class="t2" x="16" y="214" style=font-weight:600>Settings (how the speaker addresses each listener):</text><text class="t2" x="16" y="230">all_bald: bald on-record to everyone</text><text class="t2" x="16" y="246">liking: positive politeness to trusted listeners, bald to the rest</text><text class="t2" x="16" y="262">flipped: positive politeness to distrusted listeners, bald to the rest</text><text class="t2" x="16" y="278">Trusted / distrusted = top / bottom half of the speaker&#x27;s own reliability ratings.</text></svg>