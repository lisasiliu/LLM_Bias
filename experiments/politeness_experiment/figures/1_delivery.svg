<svg xmlns="http://www.w3.org/2000/svg" class="f" viewBox="0 0 680 330" width="680" role="img" aria-label="What was delivered, by setting"><style>.f{font-family:system-ui,-apple-system,Segoe UI,sans-serif;font-size:12px}.t{fill:#0b0b0b}.t2{fill:#52514e}.g{stroke:#e6e5e1}@media (prefers-color-scheme:dark){.t{fill:#fff}.t2{fill:#c3c2b7}.g{stroke:#34332f}}</style><rect width="680" height="330" fill="none"/><text class="t" x="16" y="24" style="font-size:15px;font-weight:600">What was delivered, by setting</text><text class="t2" x="16" y="42">assigned rewrite vs bald fallback vs original text (all touched utterances)</text><text class="t" x="182" y="79" text-anchor="end">all_bald</text><rect x="190.0" y="62" width="376.1" height="26" fill="#2a78d6"/><text x="378.0" y="79" fill="#fff" text-anchor="middle">90%</text><rect x="566.1" y="62" width="43.9" height="26" fill="#b9b7ae"/><text x="588.0" y="79" fill="#fff" text-anchor="middle">10%</text><text class="t2" x="618" y="79">n=239</text><text class="t" x="182" y="115" text-anchor="end">liking</text><rect x="190.0" y="98" width="324.8" height="26" fill="#2a78d6"/><text x="352.4" y="115" fill="#fff" text-anchor="middle">77%</text><rect x="514.8" y="98" width="45.9" height="26" fill="#1baf7a"/><text x="537.8" y="115" fill="#fff" text-anchor="middle">11%</text><rect x="560.8" y="98" width="49.2" height="26" fill="#b9b7ae"/><text x="585.4" y="115" fill="#fff" text-anchor="middle">12%</text><text class="t2" x="618" y="115">n=256</text><text class="t" x="182" y="151" text-anchor="end">flipped</text><rect x="190.0" y="134" width="380.3" height="26" fill="#2a78d6"/><text x="380.1" y="151" fill="#fff" text-anchor="middle">91%</text><rect x="570.3" y="134" width="21.4" height="26" fill="#1baf7a"/><rect x="591.7" y="134" width="18.3" height="26" fill="#b9b7ae"/><text class="t2" x="618" y="151">n=275</text><text class="t" x="182" y="187" text-anchor="end">all_positive</text><text class="t2" x="618" y="187">n=0</text><rect x="190" y="214" width="12" height="12" fill="#2a78d6"/><text class="t2" x="208" y="225">rewrite</text><rect x="310" y="214" width="12" height="12" fill="#1baf7a"/><text class="t2" x="328" y="225">bald fallback</text><rect x="430" y="214" width="12" height="12" fill="#b9b7ae"/><text class="t2" x="448" y="225">original text</text><text class="t2" x="16" y="250" style=font-weight:600>Settings (how the speaker addresses each listener):</text><text class="t2" x="16" y="266">all_bald: bald on-record to everyone</text><text class="t2" x="16" y="282">liking: positive politeness to trusted listeners, bald to the rest</text><text class="t2" x="16" y="298">flipped: positive politeness to distrusted listeners, bald to the rest</text><text class="t2" x="16" y="314">Trusted / distrusted = top / bottom half of the speaker&#x27;s own reliability ratings.</text></svg>