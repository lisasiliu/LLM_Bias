<svg xmlns="http://www.w3.org/2000/svg" class="f" viewBox="0 0 664 524" width="664" role="img" aria-label="Non-bald strategies by the speaker's reliability score for the listener">
<style>
.f{font-family:system-ui,-apple-system,Segoe UI,sans-serif}
:root{--bg:#fcfcfb;--ink:#0b0b0b;--ink2:#52514e;--grid:#e6e5e1;--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a}
@media (prefers-color-scheme:dark){:root{--bg:#1a1a19;--ink:#fff;--ink2:#c3c2b7;--grid:#34332f;--s1:#3987e5;--s2:#d95926;--s3:#199e70}}
.bg{fill:var(--bg)}.t{fill:var(--ink)}.t2{fill:var(--ink2)}.g{stroke:var(--grid);stroke-width:1}
.s1{fill:var(--s1)}.s2{fill:var(--s2)}.s3{fill:var(--s3)}
</style>
<rect class="bg" width="664" height="524"/>
<text class="t" x="16" y="24" font-size="15" font-weight="600">Non-bald strategies by the speaker's reliability score for the listener</text>
<text class="t2" x="16" y="43" font-size="12">Reliability 1-10, rated before that day's discussion. For villagers high means 'on my side'; for</text>
<text class="t2" x="16" y="58" font-size="12">werewolves it is confidence in a guessed identity and is always 10 for a teammate.</text>
