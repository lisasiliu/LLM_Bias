name: formality
model: Qwen/Qwen3.5-27B
n_players: 7
seeds: [101]
temperature: 0.0
max_tokens: 300
max_rounds: 20
rewriter_module: examples.formality.rewriter

comparisons:
  pred_vs_nl:
    baseline: pred_only
    replays:
      - mode: nl

  nl_vs_formality:
    baseline: nl
    replays:
      - mode: flip_self
        rewriter: FormalityRewriter
        rewriter_params: {level: formal}
        inject_at: day_start

      - mode: flip_self
        rewriter: FormalityRewriter
        rewriter_params: {level: casual}
        inject_at: day_start

      - mode: flip_others
        rewriter: FormalityRewriter
        rewriter_params: {level: formal}
        inject_at: day_start

      - mode: flip_others
        rewriter: FormalityRewriter
        rewriter_params: {level: casual}
        inject_at: day_start

metrics: [skill, vote, reliability, fairness]
