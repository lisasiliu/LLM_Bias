[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "lurkingwolf"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "python-dotenv",
    "tiktoken",
    "requests",
    "pyyaml",
]

[project.optional-dependencies]
proficiency = [
    "spacy>=3.7",
    "torch",
    "transformers",
]

[tool.setuptools.packages.find]
include = ["lurkingwolf*", "components*", "experiments*"]

[tool.setuptools.package-data]
"lurkingwolf.prompts" = ["*.json"]

[project.scripts]
lurk = "lurkingwolf.cli:main"
